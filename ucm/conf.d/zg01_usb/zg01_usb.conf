Syntax 8
Comment "Yamaha ZG01 (snd-zg01 driver)"

# Single-file UCM: HiFi verb with inline device sections. One card,
# four PCM devices:
#   hw:x,0 Game        (playback, 48k)
#   hw:x,1 Voice Out   (playback, 48k)
#   hw:x,2 Voice In    (capture, 48k)
#   hw:x,3 Streaming In (capture, 48k)
# Game and Voice Out are mixed by the device hardware; both sinks are
# meant to be used simultaneously.  Voice In and Streaming In are the
# two stereo pairs of the same four-channel capture stream.

SectionUseCase."HiFi" {
	Comment "Default"

	Config {
		SectionDevice."Game" {
			Comment "Game Out"

			Value {
				PlaybackPriority 300
				PlaybackPCM "hw:${CardId},0"
			}
		}

		SectionDevice."VoiceOut" {
			Comment "Voice Out"

			Value {
				PlaybackPriority 200
				PlaybackPCM "hw:${CardId},1"
			}
		}

		SectionDevice."VoiceIn" {
			Comment "Voice In"

			Value {
				CapturePriority 200
				CapturePCM "hw:${CardId},2"
			}
		}

		SectionDevice."StreamingIn" {
			Comment "Streaming In"

			Value {
				CapturePriority 100
				CapturePCM "hw:${CardId},3"
			}
		}
	}
}
